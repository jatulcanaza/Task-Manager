<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Web B - Login</title>
</head>
<body>
  <h2>Web B - Login normal</h2>

  <form id="f">
    <input id="email" placeholder="correo @uce.edu.ec" required />
    <input id="password" type="password" placeholder="password" required />
    <button type="submit">Entrar</button>
  </form>

  <pre id="msg"></pre>

  <script>
    const API = `http://${window.location.hostname}:8000`;
    const msg = document.getElementById("msg");
    const f = document.getElementById("f");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    function setToken(t){ localStorage.setItem("token_b", t); }

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      try{
        const res = await fetch(API + "/auth/login", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ email: email.value.trim(), password: password.value })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(JSON.stringify(data));

        setToken(data.access_token);

        // Registrar NORMAL_LOGIN en Mongo
        const res2 = await fetch(API + "/sso/mark-normal", {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + data.access_token
          }
        });
        await res2.text(); // no importa la respuesta

        window.location.href = "/dashboard.html";
      }catch(err){
        msg.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
